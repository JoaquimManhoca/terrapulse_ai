{# Inline SVG icon set (Lucide-style). No emoji, no external icon font. #}
{% macro icon(name, size=24) -%}
<svg class="icon icon-{{ name }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {%- if name == 'home' -%}
    <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/>
  {%- elif name == 'why' -%}
    <circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2.5-3 4"/><path d="M12 17h.01"/>
  {%- elif name == 'history' -%}
    <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
  {%- elif name == 'about' -%}
    <circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/>
  {%- elif name == 'rain' -%}
    <g class="weather-cloud"><path d="M7 16a4 4 0 0 1 0-8 5 5 0 0 1 9.6-1.5A4.5 4.5 0 0 1 18 16Z"/></g><g class="weather-rain"><path d="M8 19l-1 3M12 19l-1 3M16 19l-1 3"/></g>
  {%- elif name == 'cloudy' -%}
    <g class="weather-cloud"><path d="M6.5 18h11a4.5 4.5 0 0 0 .4-9 6 6 0 0 0-11.4 1.2A4 4 0 0 0 6.5 18Z"/></g>
  {%- elif name == 'partly_cloudy' -%}
    <g class="weather-sun"><circle cx="16" cy="8" r="3"/><path d="M16 2v1.5M16 12.5V14M10 8h1.5M20.5 8H22M11.8 3.8l1 1M19.2 11.2l1 1"/></g><g class="weather-cloud"><path d="M5.5 19h11a4.5 4.5 0 0 0 .4-9 6 6 0 0 0-11.4 1.2A4 4 0 0 0 5.5 19Z"/></g>
  {%- elif name == 'sun' -%}
    <g class="weather-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g>
  {%- elif name == 'moon' -%}
    <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5 8.5 8.5 0 1 0 20.5 14.5Z"/>
  {%- elif name == 'leaf' -%}
    <path d="M4 20c0-8 6-14 16-16-2 10-8 16-16 16Z"/><path d="M4 20 14 10"/>
  {%- elif name == 'sprout' -%}
    <path d="M12 21v-8"/><path d="M12 13c0-4 3-7 7-7 0 4-3 7-7 7Z"/><path d="M12 15c0-3-2.5-5.5-5.5-5.5 0 3 2.5 5.5 5.5 5.5Z"/>
  {%- elif name == 'alert' -%}
    <path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>
  {%- elif name == 'clock' -%}
    <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
  {%- elif name == 'speaker' -%}
    <path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>
  {%- elif name == 'check' -%}
    <path d="m5 12 5 5 9-10"/>
  {%- elif name == 'calendar' -%}
    <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/>
  {%- elif name == 'info' -%}
    <circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/>
  {%- elif name == 'spark' -%}
    <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9Z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9Z"/>
  {%- elif name == 'chart' -%}
    <path d="M3 3v18h18"/><path d="M7 15l4-6 3 4 5-8"/>
  {%- elif name == 'chevron' -%}
    <path d="m6 9 6 6 6-6"/>
  {%- elif name == 'share' -%}
    <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.6 6.8-4.2M8.6 13.4l6.8 4.2"/>
  {%- elif name == 'lang' -%}
    <circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18Z"/>
  {%- else -%}
    <circle cx="12" cy="12" r="9"/>
  {%- endif -%}
</svg>
{%- endmacro %}
